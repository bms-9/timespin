<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14102b">
<title>TimeSpin</title>
<style>
:root{
  --bg:#14102b; --bg2:#1d1740; --card:#262050; --line:#3a3170;
  --text:#f4f1ff; --muted:#a39cd1; --pink:#ff4fa3; --cyan:#3de0ff; --good:#2ee59d; --bad:#ff5a6e; --gold:#ffd24a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
body{background:radial-gradient(120% 80% at 50% -10%,#2b1f66 0%,var(--bg) 60%)}
#app{height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.scroll{flex:1;overflow-y:auto;padding:12px 16px 24px;-webkit-overflow-scrolling:touch}
.bar{padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--bg) 35%)}
.btn{display:block;width:100%;padding:16px;border-radius:16px;font-weight:800;font-size:17px;letter-spacing:.3px;background:linear-gradient(135deg,var(--pink),#9a4dff);box-shadow:0 8px 24px rgba(255,79,163,.35)}
.btn:disabled{opacity:.35;box-shadow:none}
.btn.alt{background:var(--card);box-shadow:none;border:1px solid var(--line)}
h1{font-size:42px;margin:28px 0 4px;letter-spacing:-1px;text-align:center}
h1 span{background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--muted);margin:0 0 22px}
.label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin:18px 0 8px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:13px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700}
.seg button.on{background:linear-gradient(135deg,var(--pink),#9a4dff);border-color:transparent}
input.name{width:100%;padding:13px 14px;margin-bottom:8px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px}
.chip{flex:none;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.chip.on{color:var(--text);border-color:var(--cyan);box-shadow:0 0 0 2px rgba(61,224,255,.25)}
.chip b{color:var(--gold);margin-left:4px}
.discwrap{display:flex;flex-direction:column;align-items:center;margin:6px 0 4px}
.disc{position:relative;width:200px;height:200px}
.disc svg{position:absolute;inset:0;transform:rotate(-90deg)}
.vinyl{position:absolute;inset:12px;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,#0d0a20 0 3px,#171235 3px 6px);box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.spin .vinyl{animation:sp 3s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.vlabel{width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#14102b}
.status{margin-top:10px;color:var(--muted);font-size:14px;min-height:20px;text-align:center}
.link{color:var(--cyan);font-size:14px;font-weight:600;padding:6px 10px}
.tl-title{font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
.tl{position:relative;padding-left:0}
.card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.card .yr{font-size:24px;font-weight:900;min-width:64px;color:var(--cyan);letter-spacing:-.5px}
.card .meta{display:flex;flex-direction:column;min-width:0}
.card .meta b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.new{border-color:var(--good);box-shadow:0 0 0 2px rgba(46,229,157,.3);animation:pop .4s}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.slot{display:flex;align-items:center;justify-content:center;width:100%;height:40px;margin:5px 0;border-radius:10px;border:2px dashed var(--line);color:var(--muted);font-weight:800;font-size:14px}
.tl-end{text-align:center;font-size:11px;font-weight:800;letter-spacing:2px;color:var(--muted);margin:6px 0}
.slot.sel{height:48px;border:2px solid var(--pink);background:rgba(255,79,163,.18);color:var(--text)}
.slot.off{opacity:.25;pointer-events:none}
.reveal{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 4px}
.reveal img{width:150px;height:150px;border-radius:16px;object-fit:cover;box-shadow:0 10px 30px rgba(0,0,0,.5);background:var(--card)}
.reveal .noimg{width:150px;height:150px;border-radius:16px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:48px}
.reveal .year{font-size:64px;font-weight:900;letter-spacing:-2px;line-height:1.05;margin-top:10px}
.reveal .ok{color:var(--good)} .reveal .no{color:var(--bad)}
.reveal .verdict{font-weight:800;font-size:18px;margin-top:2px}
.reveal .t{font-weight:700;margin-top:8px;font-size:17px}
.reveal .a{color:var(--muted);font-size:14px}
.win{text-align:center;padding-top:40px}
.win .big{font-size:60px}
.win h2{font-size:30px;margin:8px 0}
.board{margin:20px 0;text-align:left}
.board div{display:flex;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--card);margin-bottom:8px;font-weight:700}
.err{background:rgba(255,90,110,.12);border:1px solid var(--bad);border-radius:12px;padding:12px;margin:10px 0;font-size:14px;text-align:center}
.hint{color:var(--muted);font-size:13px;text-align:center;margin-top:10px}
#flash{position:fixed;inset:0;background:#ff0022;opacity:0;pointer-events:none;z-index:50;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:900;color:#fff}
#flash.go{animation:fl 6s linear forwards}
@keyframes fl{0%{opacity:.9}12%{opacity:0}24%{opacity:.9}36%{opacity:0}48%{opacity:.9}60%{opacity:0}72%{opacity:.85}100%{opacity:0}}
.shake{animation:sh .5s}
@keyframes sh{0%,100%{transform:none}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}

#flash{flex-direction:column}
#fface{position:relative;width:240px;height:240px;border-radius:24px;overflow:hidden;border:6px solid #fff;box-shadow:0 0 0 6px #ff0022,0 20px 60px rgba(0,0,0,.6);transform:scale(.3) rotate(-20deg)}
#fface img.f{width:100%;height:100%;display:block}
#fface img.g{position:absolute;left:32%;width:35%;top:-30%;image-rendering:pixelated}
#flash.go #fface{animation:fz .35s cubic-bezier(.2,1.6,.4,1) forwards}
#flash.go #fface img.g{animation:gl .5s .45s cubic-bezier(.3,1.4,.5,1) forwards}
#flash .x{font-size:38px;text-align:center;line-height:1.15;margin-top:10px;text-shadow:0 4px 20px rgba(0,0,0,.5)}
@keyframes fz{to{transform:scale(1) rotate(0)}}
@keyframes gl{to{top:38.5%}}
@keyframes fl{0%{opacity:1;background:#ff0022}5%{background:#7a0010}10%{background:#ff0022}15%{background:#7a0010}20%{background:#ff0022}25%{background:#7a0010}30%{background:#ff0022}35%{background:#7a0010}40%{background:#ff0022}45%{background:#7a0010}50%{background:#ff0022}92%{opacity:1}100%{opacity:0}}

#fface img.f{filter:grayscale(1) contrast(1.3)}
#fface .tint{position:absolute;inset:0;background:#ff1a1a;mix-blend-mode:multiply;z-index:1}
#fface .h{position:absolute;top:1%;width:24%;z-index:2;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
#fface .h.l{left:24%} #fface .h.r{right:22%;transform:scaleX(-1)}
</style>
</head>

function jsonp(url){

// returns {url, art} or null (not found). Throws on network failure.
async function lookup(s){
  if(s.p !== undefined) return s.p;
  const pre = PRE[s.t+"|"+s.a];
  if(pre){ s.p = {url:pre[0], art:pre[1]}; return s.p; }
  const q = encodeURIComponent(s.t + " " + s.a);
  const url = "https://itunes.apple.com/search?term="+q+"&media=music&entity=song&limit=15&country=US";
  let j;
  try{ j = await jsonp(url); }
  catch(e){ const r = await fetch(url); if(!r.ok) throw new Error("http "+r.status); j = await r.json(); }
  const t = norm(s.t), a = norm(s.a.replace(/^the /i,"")).slice(0,6);
  const withPrev = (j.results||[]).filter(x=>x.previewUrl && norm(x.trackName).includes(t));
  const clean = withPrev.filter(x=>BAD.test(s.t) || !BAD.test(x.trackName));
  const pick = clean.find(x=>norm(x.artistName).includes(a)) || withPrev.find(x=>norm(x.artistName).includes(a)) || null;
  s.p = pick ? {url:pick.previewUrl, art:(pick.artworkUrl100||"").replace("100x100","400x400")} : null;
  return s.p;
}

function newGame(){
  const n = setup.n;
  const deck = shuffle(SONGS);
  let di = 0;
  const players = [];
  for(let i=0;i<n;i++){
    const s = deck[di++];
    players.push({name:(setup.names[i]||"").trim()||("Player "+(i+1)), tl:[s], strikes:0});
  }
  G = {players, cur:0, goal:setup.goal, paper:setup.paper, solo:n===1, deck, di, song:null, media:null, slot:null, phase:"loading", res:null, err:null, playing:false, lastNew:null};
  nextSong();
}

async function nextSong(){
  G.phase = "loading"; G.err = null; G.slot = null; G.res = null; G.media = null; G.song = null;
  stopAudio(); render();
  let tries = 0;
  while(tries < 8){
    if(G.di >= G.deck.length){
      const used = new Set(G.players.flatMap(p=>p.tl));
      G.deck = shuffle(SONGS.filter(x=>!used.has(x))); G.di = 0;
      if(!G.deck.length){ G.err="You've played every song!"; G.phase="error"; render(); return; }
    }
    const s = G.deck[G.di];
    try{
      const m = await lookup(s);
      G.di++;
      if(m){ G.song = s; G.media = m; G.phase = "listen"; au.src = m.url; render(); prefetch(); return; }
    }catch(e){
      G.err = "Could not reach the music service. Check your connection.";
      G.phase = "error"; render(); return;
    }
    tries++;
  }
  G.err = "Could not find playable previews. Try again."; G.phase = "error"; render();
}

      for(const f of freqs){ x += ((t*f)%1 < 0.5 ? 1 : -1) * (f>400?0.6:1); }
      x = Math.tanh(x*3);                          // hard distortion = loud + harsh
      const lt = t < honk ? t : t-honk-gap;
      const env = Math.min(1, lt/0.01) * Math.min(1, (honk-lt)/0.02);
      x *= env;
    }
    pcm[i] = Math.max(-32767, Math.min(32767, x*32767));
  }
  const buf = new ArrayBuffer(44+n*2), v = new DataView(buf);
  const w = (o,str)=>{ for(let k=0;k<str.length;k++) v.setUint8(o+k,str.charCodeAt(k)); };
  w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true);
  v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,sr,true); v.setUint32(28,sr*2,true);
  v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,n*2,true);
  new Int16Array(buf,44).set(pcm);
  BUZZ_URL = URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
  return BUZZ_URL;
}
const buzzAu = new Audio(); buzzAu.preload = "auto";
function unlockSfx(){
  try{ buzzAu.src = makeBuzz(); buzzAu.volume = 0; const p = buzzAu.play(); p && p.then(()=>{ buzzAu.pause(); buzzAu.currentTime=0; buzzAu.volume=1; }).catch(()=>{}); }catch(e){}
  try{ const sy = window.speechSynthesis; if(sy){ const u = new SpeechSynthesisUtterance(" "); u.volume = 0; sy.speak(u); } }catch(e){}
}
function yell(){
  try{
    const sy = window.speechSynthesis; if(!sy) return;
    sy.cancel();
    const u = new SpeechSynthesisUtterance("ALERT! ALERT! YOU ARE WRONG!");
    u.pitch = 1.6; u.rate = 1.2; u.volume = 1;
    const vs = sy.getVoices();
    const v = vs.find(v=>/en/i.test(v.lang) && /(fred|zarvox|trinoids|bad news|bahh|whisper)/i.test(v.name)) || vs.find(v=>/en-US/i.test(v.lang));
    if(v) u.voice = v;
    sy.speak(u);
  }catch(e){}
}
function buzz(){
  try{
    buzzAu.pause(); buzzAu.src = makeBuzz(); buzzAu.volume = 1; buzzAu.currentTime = 0;
    buzzAu.onended = () => { yell(); buzzAu.onended = null; };
    buzzAu.play().catch(()=>yell());
  }catch(e){ yell(); }
  try{ navigator.vibrate && navigator.vibrate([1150,180,1150,300,600]); }catch(e){}
  const f = document.getElementById("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  const a = document.getElementById("app"); a.classList.remove("shake"); void a.offsetWidth; a.classList.add("shake");
}
function over(){
  if(G.paper) return false;
  const p = G.players[G.cur];
  if(G.solo) return p.strikes>=3 || p.tl.length>=G.goal;
  return p.tl.length>=G.goal;
}
function next(){
  if(over()){ G.phase="end"; render(); return; }
  if(!G.solo) G.cur = (G.cur+1)%G.players.length;
  nextSong();
}

// ---------- rendering ----------
function render(keepScroll){
  const app = $("#app");
  const sc = keepScroll && $(".scroll") ? $(".scroll").scrollTop : 0;
  if(!G){ app.innerHTML = setupHTML(); return; }
  if(G.phase==="end"){ app.innerHTML = endHTML(); return; }
  app.innerHTML = gameHTML();
  if(keepScroll && $(".scroll")) $(".scroll").scrollTop = sc;
  if(G.phase==="listen") syncDisc();
}

function setupHTML(){
  const nm = [];
  for(let i=0;i<setup.n;i++) nm.push('<input class="name" maxlength="14" value="'+esc(setup.names[i])+'" oninput="setup.names['+i+']=this.value" placeholder="Player '+(i+1)+'">');
  return '<div class="scroll">'
   +'<h1><span>TimeSpin</span></h1><p class="sub">Hear it. Guess when. Build your timeline.</p>'
   +'<div class="label">Players</div><div class="seg">'+[1,2,3,4].map(n=>'<button class="'+(setup.n===n?'on':'')+'" onclick="setup.n='+n+';render()">'+n+'</button>').join('')+'</div>'
   +'<div class="label">Names</div>'+nm.join('')
   +'<div class="label">Mode</div><div class="seg"><button class="'+(!setup.paper?'on':'')+'" onclick="setup.paper=false;render()">On screen</button><button class="'+(setup.paper?'on':'')+'" onclick="setup.paper=true;render()">Paper cards</button></div>'
   +(setup.paper?'':'<div class="label">Cards to win</div><div class="seg">'+[5,7,10].map(n=>'<button class="'+(setup.goal===n?'on':'')+'" onclick="setup.goal='+n+';render()">'+n+'</button>').join('')+'</div>')
   +'<p class="hint">'+(setup.paper?'Paper mode: the phone only plays songs and reveals the year. Everyone writes the year on a slip of paper, places it in their row on the table, then you reveal and check.':(setup.n===1?'Solo: reach the goal before 3 wrong guesses.':'Pass the phone each turn. First to the goal wins.'))+'</p>'
   +'</div><div class="bar"><button class="btn" onclick="unlockSfx();newGame()">Start game</button></div>';
}

function chipsHTML(){
  if(G.paper) return G.players.length>1 ? '<div class="chips">'+G.players.map((p,i)=>'<div class="chip '+(i===G.cur?'on':'')+'">'+esc(p.name)+'</div>').join('')+'</div>' : '<div class="chips"></div>';
  return '<div class="chips">'+G.players.map((p,i)=>'<div class="chip '+(i===G.cur?'on':'')+'">'+esc(p.name)+'<b>'+p.tl.length+'/'+G.goal+'</b>'+(G.solo?' <span style="color:var(--bad)">'+'x'.repeat(p.strikes)+'</span>':'')+'</div>').join('')+'</div>';
}

function cardHTML(s,isNew){
  return '<div class="card '+(isNew?'new':'')+'"><div class="yr">'+s.y+'</div><div class="meta"><b>'+esc(s.t)+'</b><span>'+esc(s.a)+'</span></div></div>';
}

function timelineHTML(){
  const p = G.players[G.cur], tl = p.tl, listen = G.phase==="listen";
  let h = '<div class="tl-title">'+esc(p.name)+(listen?': tap where this song belongs':"'s timeline")+'</div>'
    +'<div class="tl-end">&#9650; OLDER</div><div class="tl">';
  const slotLabel = i => {
    if(tl.length===0) return 'Here';
    if(i===0) return 'Before '+tl[0].y;
    if(i===tl.length) return 'After '+tl[i-1].y;
    return tl[i-1].y===tl[i].y ? 'Also '+tl[i].y : 'Between '+tl[i-1].y+' and '+tl[i].y;
  };
  for(let i=0;i<=tl.length;i++){
    if(listen) h += '<button class="slot '+(G.slot===i?'sel':'')+'" onclick="pick('+i+')">'+(G.slot===i?'&#10003; ':'')+slotLabel(i)+'</button>';
    if(i<tl.length) h += cardHTML(tl[i], G.phase==="reveal" && G.lastNew===tl[i]);
  }
  return h+'</div><div class="tl-end">&#9660; NEWER</div>';
}

function gameHTML(){
  const p = G.players[G.cur];
  let top = "", bar = "";
  if(G.phase==="loading"){
    top = '<div class="discwrap"><div class="status" style="margin-top:60px;font-size:16px">Loading next song...</div></div>';
  } else if(G.phase==="error"){
    top = '<div class="err">'+esc(G.err)+'</div>';
    bar = '<div class="bar"><button class="btn" onclick="nextSong()">Retry</button></div>';
  } else if(G.phase==="listen"){
    const C = 2*Math.PI*96;
    top = '<div class="discwrap"><div class="disc" id="disc" onclick="togglePlay()">'
      +'<svg viewBox="0 0 200 200" width="200" height="200"><circle cx="100" cy="100" r="96" fill="none" stroke="#3a3170" stroke-width="4"/>'
      +'<circle id="ring" cx="100" cy="100" r="96" fill="none" stroke="#3de0ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'"/></svg>'
      +'<div class="vinyl"><div class="vlabel">?</div></div></div>'
      +'<div class="status" id="status">Tap the disc to play</div>'
      +(G.err?'<div class="err">'+esc(G.err)+'</div>':'')
      +((G.paper||G.err)?'<button class="link" onclick="skip()">Skip this song</button>':'')+'</div>'
      + '';
    bar = G.paper
      ? '<div class="bar"><button class="btn" onclick="revealPaper()">Reveal year</button></div>'
      : '<div class="bar"><button class="btn" '+(G.slot===null?'disabled':'')+' onclick="lock()">Lock it in</button></div>';
  } else if(G.phase==="reveal"){
    const r = G.res, s = r.song;
    top = '<div class="reveal">'+(r.media.art?'<img src="'+esc(r.media.art)+'" alt="">':'<div class="noimg">&#9835;</div>')
      +'<div class="year '+(G.paper?'':(r.ok?'ok':'no'))+'" style="'+(G.paper?'color:var(--cyan)':'')+'">'+s.y+'</div>'
      +(G.paper?'':'<div class="verdict '+(r.ok?'ok':'no')+'">'+(r.ok?'Correct!':(G.solo?'Wrong. Strike '+p.strikes+' of 3':'Wrong. Card discarded'))+'</div>')
      +'<div class="t">'+esc(s.t)+'</div><div class="a">'+esc(s.a)+'</div></div>';
    const fin = over();
    let label = "Next song";
    if(fin) label = "See results";
    else if(!G.solo) label = "Pass to "+esc(G.players[(G.cur+1)%G.players.length].name);
    if(G.paper){ label = G.players.length>1 ? "Next song, "+esc(G.players[(G.cur+1)%G.players.length].name)+"'s turn" : "Next song"; }
    bar = '<div class="bar"><button class="btn" onclick="next()">'+label+'</button>'
      +(G.paper?'<div style="height:8px"></div><button class="btn alt" onclick="endPaper()">End game</button>':'')+'</div>';
  }
  const showTl = !G.paper && G.phase!=="error";
  return chipsHTML()+'<div class="scroll">'+top+(showTl?timelineHTML():'')+'</div>'+bar;
}

function endHTML(){
  const sorted = G.players.slice().sort((a,b)=>b.tl.length-a.tl.length);
  let title, emoji;
  if(G.solo){ const p=G.players[0]; const won=p.tl.length>=G.goal; title=won?"You did it!":"Game over"; emoji=won?"&#127942;":"&#128148;"; }
  else { title = esc(G.players[G.cur].name)+" wins!"; emoji="&#127942;"; }
  return '<div class="scroll"><div class="win"><div class="big">'+emoji+'</div><h2>'+title+'</h2>'
    +'<div class="board">'+sorted.map(p=>'<div><span>'+esc(p.name)+'</span><span>'+p.tl.length+' cards</span></div>').join('')+'</div></div></div>'
    +'<div class="bar"><button class="btn" onclick="unlockSfx();newGame()">Play again</button><div style="height:8px"></div><button class="btn alt" onclick="G=null;render()">Change settings</button></div>';
}

render();
</script>
</body>
</html>
