<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14102b">
<title>Babycamcams Game</title>
<style>
:root{
  --bg:#14102b; --bg2:#1d1740; --card:#262050; --line:#3a3170;
  --text:#f4f1ff; --muted:#a39cd1; --pink:#ff4fa3; --cyan:#3de0ff; --good:#2ee59d; --bad:#ff5a6e; --gold:#ffd24a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
body{background:radial-gradient(120% 80% at 50% -10%,#2b1f66 0%,var(--bg) 60%)}
#app{height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.scroll{flex:1;overflow-y:auto;padding:12px 16px 24px;-webkit-overflow-scrolling:touch}
.bar{padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--bg) 35%)}
.btn{display:block;width:100%;padding:16px;border-radius:16px;font-weight:800;font-size:17px;letter-spacing:.3px;background:linear-gradient(135deg,var(--pink),#9a4dff);box-shadow:0 8px 24px rgba(255,79,163,.35)}
.btn:disabled{opacity:.35;box-shadow:none}
.btn.alt{background:var(--card);box-shadow:none;border:1px solid var(--line)}
h1{font-size:36px;margin:28px 0 4px;letter-spacing:-1px;text-align:center}
h1 span{background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--muted);margin:0 0 22px}
.label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin:18px 0 8px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:13px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700}
.seg button.on{background:linear-gradient(135deg,var(--pink),#9a4dff);border-color:transparent}
input.name{width:100%;padding:13px 14px;margin-bottom:8px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px}
.chip{flex:none;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.chip.on{color:var(--text);border-color:var(--cyan);box-shadow:0 0 0 2px rgba(61,224,255,.25)}
.chip b{color:var(--gold);margin-left:4px}
.discwrap{display:flex;flex-direction:column;align-items:center;margin:6px 0 4px}
.disc{position:relative;width:200px;height:200px}
.disc svg{position:absolute;inset:0;transform:rotate(-90deg)}
.vinyl{position:absolute;inset:12px;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,#0d0a20 0 3px,#171235 3px 6px);box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.spin .vinyl{animation:sp 3s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.vlabel{width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#14102b}
.status{margin-top:10px;color:var(--muted);font-size:14px;min-height:20px;text-align:center}
.link{color:var(--cyan);font-size:14px;font-weight:600;padding:6px 10px}
.tl-title{font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
.tl{position:relative;padding-left:0}
.card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.card .yr{font-size:24px;font-weight:900;min-width:64px;color:var(--cyan);letter-spacing:-.5px}
.card .meta{display:flex;flex-direction:column;min-width:0}
.card .meta b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.new{border-color:var(--good);box-shadow:0 0 0 2px rgba(46,229,157,.3);animation:pop .4s}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.slot{display:flex;align-items:center;justify-content:center;width:100%;height:40px;margin:5px 0;border-radius:10px;border:2px dashed var(--line);color:var(--muted);font-weight:800;font-size:14px}
.tl-end{text-align:center;font-size:11px;font-weight:800;letter-spacing:2px;color:var(--muted);margin:6px 0}
.slot.sel{height:48px;border:2px solid var(--pink);background:rgba(255,79,163,.18);color:var(--text)}
.slot.off{opacity:.25;pointer-events:none}
.reveal{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 4px}
.reveal img{width:150px;height:150px;border-radius:16px;object-fit:cover;box-shadow:0 10px 30px rgba(0,0,0,.5);background:var(--card)}
.reveal .noimg{width:150px;height:150px;border-radius:16px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:48px}
.reveal .year{font-size:64px;font-weight:900;letter-spacing:-2px;line-height:1.05;margin-top:10px}
.reveal .ok{color:var(--good)} .reveal .no{color:var(--bad)}
.reveal .verdict{font-weight:800;font-size:18px;margin-top:2px}
.reveal .t{font-weight:700;margin-top:8px;font-size:17px}
.reveal .a{color:var(--muted);font-size:14px}
.win{text-align:center;padding-top:40px}
.win .big{font-size:60px}
.win h2{font-size:30px;margin:8px 0}
.board{margin:20px 0;text-align:left}
.board div{display:flex;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--card);margin-bottom:8px;font-weight:700}
.err{background:rgba(255,90,110,.12);border:1px solid var(--bad);border-radius:12px;padding:12px;margin:10px 0;font-size:14px;text-align:center}
.hint{color:var(--muted);font-size:13px;text-align:center;margin-top:10px}
#flash{position:fixed;inset:0;background:#ff0022;opacity:0;pointer-events:none;z-index:50;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:900;color:#fff}
#flash.go{animation:fl 6s linear forwards}
@keyframes fl{0%{opacity:.9}12%{opacity:0}24%{opacity:.9}36%{opacity:0}48%{opacity:.9}60%{opacity:0}72%{opacity:.85}100%{opacity:0}}
.shake{animation:sh .5s}
@keyframes sh{0%,100%{transform:none}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}

#flash{flex-direction:column}
#fface{position:relative;width:240px;height:240px;border-radius:24px;overflow:hidden;border:6px solid #fff;box-shadow:0 0 0 6px #ff0022,0 20px 60px rgba(0,0,0,.6);transform:scale(.3) rotate(-20deg)}
#fface img.f{width:100%;height:100%;display:block}
#fface img.g{position:absolute;left:32%;width:35%;top:-30%;image-rendering:pixelated}
#flash.go #fface{animation:fz .35s cubic-bezier(.2,1.6,.4,1) forwards}
#flash.go #fface img.g{animation:gl .5s .45s cubic-bezier(.3,1.4,.5,1) forwards}
#flash .x{font-size:38px;text-align:center;line-height:1.15;margin-top:10px;text-shadow:0 4px 20px rgba(0,0,0,.5)}
@keyframes fz{to{transform:scale(1) rotate(0)}}
@keyframes gl{to{top:38.5%}}
@keyframes fl{0%{opacity:1;background:#ff0022}4%{background:#7a0010}8%{background:#ff0022}12%{background:#7a0010}16%{background:#ff0022}20%{background:#7a0010}24%{background:#ff0022}28%{background:#7a0010}32%{background:#ff0022}36%{background:#7a0010}40%{background:#ff0022}95%{opacity:1}100%{opacity:0}}

#fface img.f{filter:grayscale(1) contrast(1.3)}
#fface .tint{position:absolute;inset:0;background:#ff1a1a;mix-blend-mode:multiply;z-index:1}
#fface .h{position:absolute;top:1%;width:24%;z-index:2;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
#fface .h.l{left:24%} #fface .h.r{right:22%;transform:scaleX(-1)}

.chip.out{opacity:.35;text-decoration:line-through}
.banner{margin:6px 0 8px;padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.35;text-align:center}
.banner b{display:block;font-size:15px;letter-spacing:1.5px;margin-bottom:2px}
.banner.reb{background:rgba(255,210,74,.14);border:1px solid var(--gold);color:#ffe9a8}
.banner.od{background:rgba(255,90,110,.16);border:1px solid var(--bad);color:#ffc4cc;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,90,110,.25)}}
#flash .xs{font-size:34px;letter-spacing:4px;margin-top:8px;max-width:90vw;text-align:center;word-break:break-all}

.banner.sab{background:rgba(160,80,255,.18);border:1px solid #a050ff;color:#e2cfff}
.sabbtn{background:linear-gradient(135deg,#7b2cff,#3a1580);box-shadow:none}
.sabmsg{text-align:center;font-weight:800;color:#e2cfff;margin-bottom:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--bg2);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:18px;text-align:center}
.sheet p{text-align:center;color:var(--muted)}
.pick{display:block;width:100%;padding:14px;margin-bottom:8px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:16px}

.range{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.rrow{display:flex;align-items:center;gap:10px;margin:4px 0}
.rrow span{width:40px;color:var(--muted);font-size:13px;font-weight:700}
.rrow b{width:52px;text-align:right;font-size:15px}
.rrow input{flex:1;accent-color:var(--pink);height:28px}
.rtxt{text-align:center;color:var(--cyan);font-weight:700;font-size:14px;margin:6px 0}
.presets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.presets button{padding:7px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:13px;font-weight:700}

.banner.drunk{background:rgba(46,229,157,.14);border:1px solid var(--good);color:#bfffe6}
.tog{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tog input{display:none}
.tog .knob{flex:none;width:52px;height:30px;border-radius:999px;background:#3a3170;position:relative;transition:.2s}
.tog .knob:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tog input:checked+.knob{background:var(--good)}
.tog input:checked+.knob:after{left:25px}
.tog .tt{font-size:13px;color:var(--muted);font-weight:600}
/* drunk goggles */
#app.drunk .scroll{animation:dsway 3.2s ease-in-out infinite, dblur 2.1s ease-in-out infinite;transform-origin:50% 40%}
#app.drunk .slot,#app.drunk .card{animation:ddrift 1.9s ease-in-out infinite alternate}
#app.drunk .slot:nth-child(3n){animation-duration:1.3s;animation-delay:-.4s}
#app.drunk .slot:nth-child(3n+1){animation-duration:2.4s;animation-delay:-1.1s;animation-direction:alternate-reverse}
#app.drunk .card:nth-child(2n){animation-duration:1.6s;animation-delay:-.7s;animation-direction:alternate-reverse}
#app.drunk .disc{animation:dwander 4s ease-in-out infinite}
#app.drunk .tl{text-shadow:6px 0 0 rgba(255,79,163,.45),-6px 0 0 rgba(61,224,255,.45)}
#app.drunk .chips,#app.drunk .bar{animation:dsway 2.6s ease-in-out infinite reverse}
@keyframes dsway{0%,100%{transform:rotate(-2.5deg) skewX(4deg) translateX(-8px)}25%{transform:rotate(1.5deg) skewX(-6deg) scale(1.03)}50%{transform:rotate(3deg) skewX(3deg) translateX(10px)}75%{transform:rotate(-1deg) skewY(2deg) scale(.97)}}
@keyframes dblur{0%,100%{filter:blur(.4px) hue-rotate(0deg)}50%{filter:blur(1.6px) hue-rotate(40deg)}}
@keyframes ddrift{0%{transform:translateX(-38px) rotate(-4deg)}50%{transform:translateX(12px) translateY(6px) rotate(2deg)}100%{transform:translateX(40px) rotate(5deg)}}
@keyframes dwander{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(60px,10px) rotate(12deg)}50%{transform:translate(-50px,-6px) rotate(-10deg)}75%{transform:translate(30px,14px) rotate(6deg)}}

.banner.chaos{background:rgba(255,210,74,.16);border:1px solid var(--gold);color:#fff3c4}
.banner.chaos.spin b{animation:pulse 0.6s infinite}
.banner.chaos #wheelTxt{display:block;font-size:22px;font-weight:900;letter-spacing:1px;margin-top:2px}
.chaosbtn{background:linear-gradient(135deg,#d99a00,#7a4a00)}

#hbfx{position:fixed;inset:0;pointer-events:none;z-index:48;display:none;background:radial-gradient(ellipse at center,rgba(255,0,40,0) 35%,rgba(255,0,40,.55) 100%)}
#hbfx.on{display:block;animation:hbvig .9s infinite}
#hbfx .heart{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 54px);width:90px;height:82px;margin-left:-45px;filter:drop-shadow(0 0 14px rgba(255,0,40,.9))}
#hbfx.on .heart{animation:hbpump .9s infinite}
#app.hb:not(.drunk) .scroll,#app.hb .chips{animation:hbscreen .9s infinite}
#app.hb{background:rgba(160,0,25,.35)}
@keyframes hbpump{0%{transform:scale(1)}12%{transform:scale(1.35)}22%{transform:scale(1.05)}34%{transform:scale(1.28)}50%,100%{transform:scale(1)}}
@keyframes hbvig{0%{background:radial-gradient(ellipse at center,rgba(255,0,40,.06) 30%,rgba(255,0,40,.45) 100%)}12%{background:radial-gradient(ellipse at center,rgba(255,0,40,.22) 20%,rgba(255,0,40,.8) 100%)}22%{background:radial-gradient(ellipse at center,rgba(255,0,40,.08) 30%,rgba(255,0,40,.5) 100%)}34%{background:radial-gradient(ellipse at center,rgba(255,0,40,.18) 22%,rgba(255,0,40,.72) 100%)}60%,100%{background:radial-gradient(ellipse at center,rgba(255,0,40,.04) 32%,rgba(255,0,40,.4) 100%)}}
@keyframes hbscreen{0%,50%,100%{transform:none}10%{transform:scale(1.05) translateX(-6px)}16%{transform:scale(1.01) translateX(5px)}22%{transform:scale(1.02) translateX(-3px)}32%{transform:scale(1.045) translateX(6px)}40%{transform:scale(1.01) translateX(-2px)}}

#devilpop{position:fixed;left:50%;top:50%;z-index:45;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.2)}
#devilpop.go{animation:devil 3.6s ease-out forwards}
#devilpop .dface{position:relative;width:200px;height:200px;border-radius:22px;overflow:hidden;border:5px solid #fff;box-shadow:0 0 0 5px #ff0022,0 0 60px rgba(255,0,34,.9)}
#devilpop .dface img.f{width:100%;height:100%;display:block}
#devilpop .dface img.g{position:absolute;left:32%;width:35%;top:38.5%;image-rendering:pixelated}
#devilpop .dtxt{text-align:center;font-weight:900;font-size:26px;color:#fff;margin-top:8px;text-shadow:0 0 12px #ff0022,0 3px 8px #000;letter-spacing:2px}
@keyframes devil{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-25deg)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(8deg)}16%{transform:translate(-50%,-50%) scale(1) rotate(-5deg)}22%{transform:translate(-50%,-50%) scale(1.05) rotate(4deg)}28%{transform:translate(-50%,-50%) scale(1) rotate(-3deg)}34%,80%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6) rotate(15deg)}}
#devilpop .dface img.f{filter:grayscale(1) contrast(1.3)}
#devilpop .dface img.g{z-index:3}
#devilpop .tint{position:absolute;inset:0;background:#ff1a1a;mix-blend-mode:multiply;z-index:1}
#devilpop .h{position:absolute;top:1%;width:24%;z-index:2;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
#devilpop .h.l{left:24%}
#devilpop .h.r{right:22%;transform:scaleX(-1)}

#blackfx{position:fixed;inset:0;z-index:35;pointer-events:none;display:none;--x:-300px;--y:-300px;
  background:radial-gradient(circle 85px at var(--x) var(--y), rgba(0,0,0,0) 0, rgba(0,0,0,0) 55px, rgba(0,0,0,.985) 85px)}
#app.blackout ~ #blackfx{display:block}
#app.blackout .bar{position:relative;z-index:36}
#app.blackout .bar .btn{box-shadow:0 0 24px rgba(255,79,163,.8)}

#app.spinmode .scroll{animation:spinall 5s linear infinite !important;transform-origin:50% 45%}
#app.spinmode .chips{animation:spinall 3s linear infinite reverse}
@keyframes spinall{to{transform:rotate(360deg)}}

#jumpfx{position:fixed;inset:0;z-index:200;background:#000;display:none;pointer-events:none}
#jumpfx.on{display:block;animation:jumpin .12s ease-out}
#jumpfx video{width:100%;height:100%;object-fit:cover}
@keyframes jumpin{from{transform:scale(1.6);opacity:.2}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<div id="blackfx"></div>

async function reversedUrl(url){

const jumpAu = new Audio(); jumpAu.preload = "auto";
function jumpscare(){
  const fx = document.getElementById("jumpfx"), vid = document.getElementById("jumpv");
  const wasPlaying = !au.paused;
  try{ au.pause(); }catch(e){}
  if(vid.src !== JUMP_V) vid.src = JUMP_V;
  vid.muted = true; vid.currentTime = 0;
  fx.classList.add("on");
  vid.play().catch(()=>{});
  if(!(G && G.quiet)){ try{ jumpAu.src = JUMP_A; jumpAu.volume = 1; jumpAu.currentTime = 0; jumpAu.play().catch(()=>{}); }catch(e){} }
  try{ navigator.vibrate && navigator.vibrate([600,80,600]); }catch(e){}
  const done = () => { fx.classList.remove("on"); vid.onended = null; if(wasPlaying && G && G.phase==="listen"){ au.play().catch(()=>{}); } };
  vid.onended = done;
  clearTimeout(window.__jumpT); window.__jumpT = setTimeout(done, 3200);
}
function laughLoop(on){
  try{
    if(on){ if(G && G.quiet) return; laughAu.loop = true; if(laughAu.src!==LAUGH_MP3) laughAu.src = LAUGH_MP3; laughAu.volume = 1; laughAu.currentTime = 0; laughAu.play().catch(()=>{}); }
    else { laughAu.loop = false; laughAu.pause(); }
  }catch(e){}
}
function devilPop(){
  let d = document.getElementById("devilpop");
  if(!d){
    d = document.createElement("div"); d.id = "devilpop";
    const src = document.getElementById("fface");
    d.innerHTML = '<div class="dface">'+src.innerHTML+'</div><div class="dtxt">TICK TOCK...</div>';
    document.body.appendChild(d);
  }
  d.classList.remove("go"); void d.offsetWidth; d.classList.add("go");
  laugh();
}
(function(){
  const mv = e => { const t = e.touches ? e.touches[0] : e; if(!t) return; const b=document.getElementById("blackfx"); if(b){ b.style.setProperty("--x", t.clientX+"px"); b.style.setProperty("--y", t.clientY+"px"); } };
  const off = () => { const b=document.getElementById("blackfx"); if(b){ b.style.setProperty("--x","-300px"); b.style.setProperty("--y","-300px"); } };
  ["touchstart","touchmove","pointerdown","pointermove"].forEach(ev=>document.addEventListener(ev, mv, {passive:true}));
  ["touchend","touchcancel","pointerup"].forEach(ev=>document.addEventListener(ev, e=>{ if(e.pointerType==="mouse") return; off(); }, {passive:true}));
})();
function hbFx(on){ const f=document.getElementById("hbfx"); if(f) f.classList.toggle("on",on); const a=document.getElementById("app"); if(a) a.classList.toggle("hb",on); }
function hbOn(){ hbFx(true); if(G && G.quiet) return; try{ if(!hbAu.paused) return; if(hbAu.src!==HB_MP3) hbAu.src = HB_MP3; hbAu.volume = 1; hbAu.play().catch(()=>{}); }catch(e){} }
function hbOff(){ hbFx(false); try{ hbAu.pause(); hbAu.currentTime = 0; }catch(e){} }
function hbDue(){ return G && G.phase==="listen" && ((!G.paper && G.players[G.cur].lastWrong) || au.currentTime >= 20); }
function stopAudio(){ try{au.pause();}catch(e){} hbOff(); staticOff(); stutterOff(); laughLoop(false); G && (G.playing=false); }
au.addEventListener("timeupdate", ()=>{
  const el = $("#ring"); if(!el || !au.duration) return;
  const C = 2*Math.PI*96;
  el.style.strokeDashoffset = C*(1 - au.currentTime/au.duration);
  if(hbDue()) hbOn();
  if(chaosOn("jump") && !G.jumped && au.currentTime >= 5){ G.jumped = true; jumpscare(); }
  if(G && G.phase==="listen" && !G.paper && !G.devilShown && au.currentTime >= 15){ G.devilShown = true; devilPop(); }
  if(chaosOn("flash") && au.currentTime >= 5){ G.flashUsed = true; au.pause(); const st=$("#status"); if(st) st.textContent="Time is up. Place it."; }
});
au.addEventListener("ended", ()=>{ G.playing=false; syncDisc(); });
au.addEventListener("pause", ()=>{ staticOff(); stutterOff(); if(G){G.playing=false; syncDisc(); if(chaosOn("flash")&&G.flashUsed){ const st=$("#status"); if(st) st.textContent="Time is up. Place it."; }} });
au.addEventListener("play", ()=>{ if(G){ applyRate(); if(chaosOn("static")) staticOn(); if(chaosOn("stutter")) stutterOn(); } });
au.addEventListener("playing", ()=>{ if(G){G.playing=true; syncDisc();} });
au.addEventListener("error", ()=>{ if(G && G.phase==="listen"){ G.err="This clip will not play. Skip it."; render(); } });

function syncDisc(){
  const d = $("#disc"); if(d) d.classList.toggle("spin", !!G.playing);
  const s = $("#status"); if(s) s.textContent = G.playing ? "Playing... place it on the timeline" : "Tap the disc to play";
}
function togglePlay(){
  if(G.phase!=="listen") return;
  if(au.paused){ if(chaosOn("flash") && G.flashUsed) return; if(hbDue()) hbOn(); if(au.ended || au.currentTime>=(au.duration||99)-0.2) au.currentTime=0; au.play().catch(()=>{ G.err="Playback blocked. Tap the disc again."; render(); }); }
  else au.pause();
}
function skip(){ nextSong(); }
function pick(i){ if(G.phase!=="listen") return; G.slot = (G.slot===i?null:i); render(true); }

function lock(){

let SEQ = 0;
function playSeq(src, count, after){
  const id = ++SEQ; let left = count;
  try{
    buzzAu.pause(); buzzAu.onended = null;
    if(buzzAu.src !== src) buzzAu.src = src;
    buzzAu.volume = 1;
    const go = () => { if(id!==SEQ) return; if(left<=0){ buzzAu.onended=null; after && after(); return; } left--; buzzAu.currentTime = 0; buzzAu.play().catch(()=>{ after && after(); }); };
    buzzAu.onended = go; go();
  }catch(e){ after && after(); }
}

  try{ laughAu.src = LAUGH_MP3; laughAu.volume = 0; const q = laughAu.play(); q && q.then(()=>{ laughAu.pause(); laughAu.currentTime=0; laughAu.volume=1; }).catch(()=>{}); }catch(e){}
  try{ hbAu.src = HB_MP3; hbAu.volume = 0; const q = hbAu.play(); q && q.then(()=>{ hbAu.pause(); hbAu.currentTime=0; hbAu.volume=1; }).catch(()=>{}); }catch(e){}
  try{ buzzAu.src = BUZZ_MP3; buzzAu.volume = 0; const p = buzzAu.play(); p && p.then(()=>{ buzzAu.pause(); buzzAu.currentTime=0; buzzAu.volume=1; }).catch(()=>{}); }catch(e){}
  try{ const sy = window.speechSynthesis; if(sy){ const u = new SpeechSynthesisUtterance(" "); u.volume = 0; sy.speak(u); } }catch(e){}
}
function yell(){
  try{
    const sy = window.speechSynthesis; if(!sy) return;
    sy.cancel();
    const u = new SpeechSynthesisUtterance("ALERT! ALERT! YOU ARE WRONG!");
    u.pitch = 1.6; u.rate = 1.2; u.volume = 1;
    const vs = sy.getVoices();
    const v = vs.find(v=>/en/i.test(v.lang) && /(fred|zarvox|trinoids|bad news|bahh|whisper)/i.test(v.name)) || vs.find(v=>/en-US/i.test(v.lang));
    if(v) u.voice = v;
    sy.speak(u);
  }catch(e){}
}
function buzz(k){
  k = Math.max(1, k||1);
  const buzzes = 2 + k;                  // 1st wrong: 3 buzzes, 2nd: 4, 3rd: 5...
  const dur = 9 + 2*k;                   // 1st wrong: 11s screen, 2nd: 13s, 3rd: 15s...
  if(!G.quiet) playSeq(BUZZ1_MP3, buzzes, ()=>playSeq(HORN_MP3, 1, yell));
  try{ navigator.vibrate && navigator.vibrate(Array.from({length:buzzes*2-1},(_,i)=>i%2?40:900)); }catch(e){}
  const xs = document.getElementById("xs"); if(xs) xs.textContent = "\u274C".repeat(k);
  const f = document.getElementById("flash"); f.style.animationDuration = dur+"s";
  clearTimeout(window.__flashT); window.__flashT = setTimeout(()=>f.classList.remove("go"), dur*1000+50);
  f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  const a = document.getElementById("app"); a.classList.remove("shake"); void a.offsetWidth; a.classList.add("shake");
}
function over(){
  if(G.paper) return false;
  const p = G.players[G.cur];
  if(G.solo) return p.strikes>=3 || p.tl.length>=G.goal;
  return p.tl.length>=G.goal;
}
// Multiplayer flow: regulation -> rebuttal -> sudden death
function plan(){
  const P = G.players, n = P.length, g = G.goal, c = G.cur, alive = i => !P[i].out;
  if(G.stage==="reg"){
    if(P[c].tl.length < g) return {cur:(c+1)%n};
    const q = []; for(let i=c+1;i<n;i++) if(P[i].tl.length===g-1) q.push(i);
    const outs = P.map((_,i)=>i).filter(i=>i!==c && !q.includes(i));
    if(!q.length) return {winner:c, outs};
    return {stage:"reb", cur:q[0], queue:q.slice(1), outs, intro:"reb"};
  }
  if(G.stage==="reb"){
    const outs = P[c].tl.length < g ? [c] : [];
    if(G.queue.length) return {stage:"reb", cur:G.queue[0], queue:G.queue.slice(1), outs};
    const fin = P.map((_,i)=>i).filter(i=>alive(i) && !outs.includes(i) && P[i].tl.length>=g);
    if(fin.length===1) return {winner:fin[0], outs};
    return {stage:"od", alive:fin, cur:fin[0], queue:fin.slice(1), odRes:{}, round:1, outs, intro:"od"};
  }
  const res = Object.assign({}, G.odRes, {[c]:G.lastOk});
  if(G.queue.length) return {stage:"od", cur:G.queue[0], queue:G.queue.slice(1), odRes:res};
  const right = G.alive.filter(i=>res[i]);
  let al = G.alive, outs = [];
  if(right.length && right.length < G.alive.length){
    outs = G.alive.filter(i=>!res[i]); al = right;
    if(al.length===1) return {winner:al[0], outs};
  }
  return {stage:"od", alive:al, cur:al[0], queue:al.slice(1), odRes:{}, round:G.round+1, outs, intro:"od"};
}
function next(){
  if(G.paper || G.solo){
    if(over()){ G.phase="end"; render(); return; }
    if(!G.solo) G.cur = (G.cur+1)%G.players.length;
    nextSong(); return;
  }
  const pl = plan();
  (pl.outs||[]).forEach(i=>G.players[i].out=true);
  if(pl.winner!==undefined){ G.winner = pl.winner; G.phase="end"; render(); return; }
  ["stage","cur","queue","alive","odRes","round"].forEach(k=>{ if(pl[k]!==undefined) G[k]=pl[k]; });
  nextSong();
}
function sabBannerHTML(){
  const p = G.players[G.cur];
  if(G.back) return G.rev==="fail" ? '<div class="banner sab"><b>&#9194; BACKWARDS MODE</b>This phone could not reverse this song, so it plays normally.</div>' : "";
  if(!p.sabBy) return "";
  if(G.rev===true) return '<div class="banner sab"><b>&#128163; SABOTAGED</b>'+esc(p.sabBy)+' made this song play BACKWARDS.</div>';
  return '<div class="banner sab"><b>&#128163; SABOTAGED</b>'+esc(p.sabBy)+' sabotaged you, but this phone could not reverse the song, so it plays normally.</div>';
}
function canSab(kind){
  if(G.solo || G.paper) return false;
  const p = G.players[G.cur];
  if(kind==="back") return G.sabBack && !G.back && !p.sabUsed;
  return G.sabChaos && !p.chaosUsed;
}
function sabOpen(kind){ G.sab = {kind}; render(true); }
function sabClose(){ G.sab = null; render(true); }
function sabTarget(t){
  const by = G.players[G.cur], tg = G.players[t];
  if(G.sab.kind==="back"){ by.sabUsed = true; tg.sabBy = by.name; G.sabMsg = '&#128163; '+esc(by.name)+' sabotaged '+esc(tg.name)+'! Their next song plays backwards.'; }
  else { by.chaosUsed = true; tg.chaosBy = by.name; G.sabMsg = '&#127905; '+esc(by.name)+' hit '+esc(tg.name)+' with the Chaos Wheel! It spins on their next turn.'; }
  G.sab = null; render(true);
}
function sabModalHTML(){
  if(!G.sab) return "";
  const P = G.players;
  const field = G.sab.kind==="back" ? "sabBy" : "chaosBy";
  const tg = P.map((p,i)=>i).filter(i=>i!==G.cur && !P[i].out && !P[i][field]);
  const what = G.sab.kind==="back" ? "&#128163; Backwards sabotage" : "&#127905; Chaos Wheel sabotage";
  const body = '<h3>'+esc(P[G.cur].name)+': '+what+'<br>Who gets it?</h3>'+(tg.length? tg.map(i=>'<button class="pick" onclick="sabTarget('+i+')">'+esc(P[i].name)+'</button>').join('') : '<p>No one left to target.</p>');
  return '<div class="modal" onclick="if(event.target===this)sabClose()"><div class="sheet">'+body+'<button class="btn alt" onclick="sabClose()">Cancel</button></div></div>';
}
function drunkWhy(){ if(!G || G.paper) return null; const p=G.players[G.cur]; if((p.streak||0)>=4) return "streak"; if(p.tl.length===G.goal-1) return "close"; return null; }
function isDrunk(){ return G && G.phase==="listen" && ((G.drunk && !!drunkWhy()) || chaosOn("drunk")); }
function isChip(){ return G && G.chip && !G.paper && !!drunkWhy(); }
function applyRate(){ const r = (isChip()||chaosOn("chip")) ? 1.45 : chaosOn("slow") ? 0.6 : 1; try{ au.preservesPitch = false; au.mozPreservesPitch = false; au.webkitPreservesPitch = false; au.defaultPlaybackRate = r; au.playbackRate = r; }catch(e){} }
function drunkBannerHTML(){
  const why = drunkWhy(); if(!why || (!isDrunk() && !isChip())) return "";
  const p = G.players[G.cur];
  const t = (isDrunk()?'&#129396; DRUNK GOGGLES':'')+(isDrunk()&&isChip()?' + ':'')+(isChip()?'&#128063; CHIPMUNK':'');
  const r = why==="streak" ? esc(p.name)+' is on a '+p.streak+'-song streak.' : esc(p.name)+' is 1 card from winning.';
  return '<div class="banner drunk"><b>'+t+'</b>'+r+' Good luck.</div>';
}
function bannerHTML(){
  if(G.paper || G.solo) return "";
  const p = G.players[G.cur];
  if(G.stage==="reb") return '<div class="banner reb"><b>REBUTTAL</b>'+esc(p.name)+': get it right to tie and force sudden death. Miss and you are out.</div>';
  if(G.stage==="od") return '<div class="banner od"><b>SUDDEN DEATH &middot; ROUND '+G.round+'</b>'+esc(p.name)+': miss while someone else hits and you are out.</div>';
  return "";
}

// ---------- rendering ----------
function render(keepScroll){
  const app = $("#app");
  const sc = keepScroll && $(".scroll") ? $(".scroll").scrollTop : 0;
  app.classList.remove("drunk"); app.classList.remove("blackout"); app.classList.remove("spinmode");
  if(!G){ app.innerHTML = setupHTML(); return; }
  if(G.phase==="end"){ app.innerHTML = endHTML(); return; }
  app.innerHTML = gameHTML();
  app.classList.toggle("drunk", isDrunk());
  app.classList.toggle("blackout", !!(G.phase==="listen" && chaosOn("black") && !G.spinning));
  app.classList.toggle("spinmode", !!(G.phase==="listen" && chaosOn("spin") && !G.spinning));
  if(keepScroll && $(".scroll")) $(".scroll").scrollTop = sc;
  if(G.phase==="listen") syncDisc();
}

function setupHTML(){
  const nm = [];
  for(let i=0;i<setup.n;i++) nm.push('<input class="name" maxlength="14" value="'+esc(setup.names[i])+'" oninput="setup.names['+i+']=this.value" placeholder="Player '+(i+1)+'">');
  return '<div class="scroll">'
   +'<h1><span>Babycamcams Game</span></h1><p class="sub">Hear it. Guess when. Build your timeline.</p>'
   +'<div class="label">Players</div><div class="seg">'+[1,2,3,4,5,6].map(n=>'<button class="'+(setup.n===n?'on':'')+'" onclick="setup.n='+n+';render()">'+n+'</button>').join('')+'</div>'
   +'<div class="label">Names</div>'+nm.join('')
   +'<div class="label">Song years</div><div class="range">'
   +'<div class="rrow"><span>From</span><input type="range" min="1950" max="2020" step="10" value="'+setup.from+'" oninput="setRange(\'from\',this.value)"><b id="fromLbl">'+decLabel(setup.from)+'</b></div>'
   +'<div class="rrow"><span>To</span><input type="range" min="1950" max="2020" step="10" value="'+setup.to+'" oninput="setRange(\'to\',this.value)"><b id="toLbl">'+decLabel(setup.to)+'</b></div>'
   +'<div class="rtxt" id="rangeTxt">'+rangeText()+'</div>'
   +'<div class="presets">'+[["All",1950,2020],["80s",1980,1980],["2000s",2000,2000],["70s-2000s",1970,2000],["90s-now",1990,2020]].map(x=>'<button onclick="rangePreset('+x[1]+','+x[2]+')">'+x[0]+'</button>').join('')+'</div></div>'
   +'<div class="label">Sabotages (1 of each per player, used at the end of your own turn)</div>'
   +'<label class="tog"><input type="checkbox" '+(setup.sabBack?'checked':'')+' onchange="setup.sabBack=this.checked"><span class="knob"></span><span class="tt">&#128163; Backwards: target\'s next song plays in reverse</span></label><div style="height:8px"></div>'
   +'<label class="tog"><input type="checkbox" '+(setup.sabChaos?'checked':'')+' onchange="setup.sabChaos=this.checked"><span class="knob"></span><span class="tt">&#127905; Chaos Wheel: target gets a Chaos Wheel spin on their next turn</span></label>'
   +'<div class="label">&#127905; Chaos Wheel</div><label class="tog"><input type="checkbox" '+(setup.chaos?'checked':'')+' onchange="setup.chaos=this.checked"><span class="knob"></span><span class="tt">Every turn spins a random rule: backwards, chipmunk, slow-mo, 5-second flash, drunk goggles, blackout, hidden years, radio static, stutter, spin cycle, plus one secret rule</span></label>'
   +'<div class="label">Drunk goggles</div><label class="tog"><input type="checkbox" '+(setup.drunk?'checked':'')+' onchange="setup.drunk=this.checked"><span class="knob"></span><span class="tt">Screen wobbles on a 4-in-a-row streak or 1 card from winning</span></label>'
   +'<div class="label">Chipmunk songs</div><label class="tog"><input type="checkbox" '+(setup.chip?'checked':'')+' onchange="setup.chip=this.checked"><span class="knob"></span><span class="tt">High-pitched, sped-up song on a 4-in-a-row streak or 1 card from winning</span></label>'
   +'<div class="label">Quiet mode</div><label class="tog"><input type="checkbox" '+(setup.quiet?'checked':'')+' onchange="setup.quiet=this.checked"><span class="knob"></span><span class="tt">Mutes the buzzer, airhorn, yell, ding and heartbeat. Songs and screen effects stay.</span></label>'
   +'<div class="label">Backwards mode</div><div class="seg"><button class="'+(!setup.back?'on':'')+'" onclick="setup.back=false;render()">Normal</button><button class="'+(setup.back?'on':'')+'" onclick="setup.back=true;render()">&#9194; All backwards</button></div>'
   +(setup.back?'<p class="hint">Every song plays in reverse. Sabotages are off in this mode.</p>':'')
   +'<div class="label">Mode</div><div class="seg"><button class="'+(!setup.paper?'on':'')+'" onclick="setup.paper=false;render()">On screen</button><button class="'+(setup.paper?'on':'')+'" onclick="setup.paper=true;render()">Paper cards</button></div>'
   +(setup.paper?'':'<div class="label">Cards to win</div><div class="seg">'+[5,7,10].map(n=>'<button class="'+(setup.goal===n?'on':'')+'" onclick="setup.goal='+n+';render()">'+n+'</button>').join('')+'</div>')
   +'<p class="hint">'+(setup.paper?'Paper mode: the phone only plays songs and reveals the year. Everyone writes the year on a slip of paper, places it in their row on the table, then you reveal and check.':(setup.n===1?'Solo: reach the goal before 3 wrong guesses.':'Pass the phone each turn. Sabotages are used at the end of your own turn. First to the goal wins, but players after them that round who are 1 card short get a rebuttal. Ties go to sudden death.'))+'</p>'
   +'</div><div class="bar"><button class="btn" id="startBtn" '+(pool().length<20?"disabled":"")+' onclick="unlockSfx();newGame()">Start game</button></div>';
}

function chipsHTML(){
  if(G.paper) return G.players.length>1 ? '<div class="chips">'+G.players.map((p,i)=>'<div class="chip '+(i===G.cur?'on':'')+'">'+esc(p.name)+'</div>').join('')+'</div>' : '<div class="chips"></div>';
  return '<div class="chips">'+G.players.map((p,i)=>'<div class="chip '+(i===G.cur?'on':'')+(p.out?' out':'')+'">'+esc(p.name)+(!G.solo&&G.sabBack&&!G.back&&!p.sabUsed?' &#128163;':'')+(!G.solo&&G.sabChaos&&!p.chaosUsed?' &#127905;':'')+'<b>'+p.tl.length+'/'+G.goal+'</b>'+(G.solo?' <span style="color:var(--bad)">'+'x'.repeat(p.strikes)+'</span>':'')+'</div>').join('')+'</div>';
}

function cardHTML(s,isNew){
  const hid = chaosOn("hide") && G.phase==="listen";
  return '<div class="card '+(isNew?'new':'')+'"><div class="yr">'+(hid?'????':s.y)+'</div><div class="meta"><b>'+esc(s.t)+'</b><span>'+esc(s.a)+'</span></div></div>';
}

function timelineHTML(){
  const p = G.players[G.cur], tl = p.tl, listen = G.phase==="listen";
  let h = '<div class="tl-title">'+esc(p.name)+(listen?': tap where this song belongs':"'s timeline")+'</div>'
    +'<div class="tl-end">&#9650; OLDER</div><div class="tl">';
  const slotLabel = i => {
    if(tl.length===0) return 'Here';
    if(chaosOn("hide")) return i===0?'Top':i===tl.length?'Bottom':'Here';
    if(i===0) return 'Before '+tl[0].y;
    if(i===tl.length) return 'After '+tl[i-1].y;
    return tl[i-1].y===tl[i].y ? 'Also '+tl[i].y : 'Between '+tl[i-1].y+' and '+tl[i].y;
  };
  for(let i=0;i<=tl.length;i++){
    if(listen) h += '<button class="slot '+(G.slot===i?'sel':'')+'" onclick="pick('+i+')">'+(G.slot===i?'&#10003; ':'')+slotLabel(i)+'</button>';
    if(i<tl.length) h += cardHTML(tl[i], G.phase==="reveal" && G.lastNew===tl[i]);
  }
  return h+'</div><div class="tl-end">&#9660; NEWER</div>';
}

function gameHTML(){
  const p = G.players[G.cur];
  let top = "", bar = "";
  if(G.phase==="loading"){
    top = '<div class="discwrap"><div class="status" style="margin-top:60px;font-size:16px">Loading next song...</div></div>';
  } else if(G.phase==="error"){
    top = '<div class="err">'+esc(G.err)+'</div>';
    bar = '<div class="bar"><button class="btn" onclick="nextSong()">Retry</button></div>';
  } else if(G.phase==="listen"){
    const C = 2*Math.PI*96;
    top = '<div class="discwrap"><div class="disc" id="disc" onclick="togglePlay()">'
      +'<svg viewBox="0 0 200 200" width="200" height="200"><circle cx="100" cy="100" r="96" fill="none" stroke="#3a3170" stroke-width="4"/>'
      +'<circle id="ring" cx="100" cy="100" r="96" fill="none" stroke="#3de0ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'"/></svg>'
      +'<div class="vinyl"><div class="vlabel">'+(G.rev===true?'&#9194;':'?')+'</div></div></div>'
      +'<div class="status" id="status">Tap the disc to play</div>'
      +(G.err?'<div class="err">'+esc(G.err)+'</div>':'')
      +((G.paper||G.err)?'<button class="link" onclick="skip()">Skip this song</button>':'')+'</div>'
      + '';
    bar = G.paper
      ? '<div class="bar"><button class="btn" onclick="revealPaper()">Reveal year</button></div>'
      : '<div class="bar"><button class="btn" '+(G.slot===null?'disabled':'')+' onclick="lock()">Lock it in</button></div>';
  } else if(G.phase==="reveal"){
    const r = G.res, s = r.song;
    top = '<div class="reveal">'+(r.media.art?'<img src="'+esc(r.media.art)+'" alt="">':'<div class="noimg">&#9835;</div>')
      +'<div class="year '+(G.paper?'':(r.ok?'ok':'no'))+'" style="'+(G.paper?'color:var(--cyan)':'')+'">'+s.y+'</div>'
      +(G.paper?'':'<div class="verdict '+(r.ok?'ok':'no')+'">'+(r.ok?'Correct!':(G.solo?'Wrong. Strike '+p.strikes+' of 3':'Wrong. Card discarded'))+'</div>')
      +'<div class="t">'+esc(s.t)+'</div><div class="a">'+esc(s.a)+'</div></div>';
    let label = "Next song";
    if(G.solo){ if(over()) label = "See results"; }
    else if(!G.paper){ const pl = plan(); label = pl.winner!==undefined ? "See results" : (pl.intro==="reb" ? "Rebuttal: pass to " : pl.intro==="od" ? "Sudden death: pass to " : "Pass to ")+esc(G.players[pl.cur].name); }
    if(G.paper){ label = G.players.length>1 ? "Next song, "+esc(G.players[(G.cur+1)%G.players.length].name)+"'s turn" : "Next song"; }
    const nm = esc(G.players[G.cur].name);
    const sb = (canSab("back")?'<button class="btn sabbtn" onclick="sabOpen(\'back\')">&#128163; '+nm+': Backwards sabotage</button><div style="height:8px"></div>':'')
             + (canSab("chaos")?'<button class="btn sabbtn chaosbtn" onclick="sabOpen(\'chaos\')">&#127905; '+nm+': Chaos Wheel sabotage</button><div style="height:8px"></div>':'');
    bar = '<div class="bar">'+(G.sabMsg?'<div class="sabmsg">'+G.sabMsg+'</div>':'')+sb+'<button class="btn" onclick="next()">'+label+'</button>'
      +(G.paper?'<div style="height:8px"></div><button class="btn alt" onclick="endPaper()">End game</button>':'')+'</div>';
  }
  const showTl = !G.paper && G.phase!=="error";
  return chipsHTML()+'<div class="scroll">'+(G.phase==="listen"?chaosBannerHTML()+drunkBannerHTML()+sabBannerHTML()+bannerHTML():'')+top+(showTl?timelineHTML():'')+'</div>'+bar+sabModalHTML();
}

function endHTML(){
  const W = G.winner!==null ? G.players[G.winner] : null;
  const sorted = G.players.slice().sort((a,b)=>(b===W)-(a===W) || b.tl.length-a.tl.length);
  let title, emoji;
  if(G.solo){ const p=G.players[0]; const won=p.tl.length>=G.goal; title=won?"You did it!":"Game over"; emoji=won?"&#127942;":"&#128148;"; }
  else { title = esc(G.players[G.winner!==null?G.winner:G.cur].name)+" wins!"+(G.stage==="od"?" (sudden death)":G.stage==="reb"?" (after rebuttal)":""); emoji="&#127942;"; }
  return '<div class="scroll"><div class="win"><div class="big">'+emoji+'</div><h2>'+title+'</h2>'
    +'<div class="board">'+sorted.map(p=>'<div><span>'+esc(p.name)+'</span><span>'+p.tl.length+' cards</span></div>').join('')+'</div></div></div>'
    +'<div class="bar"><button class="btn" onclick="unlockSfx();newGame()">Play again</button><div style="height:8px"></div><button class="btn alt" onclick="G=null;render()">Change settings</button></div>';
}

render();
</script>
